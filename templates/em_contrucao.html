{% extends "base.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-16 bg-white dark:bg-gray-800 p-8 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm text-center space-y-3">
    <i class="fa-solid fa-hammer text-3xl text-indigo-500"></i>
    <h2 class="text-xl font-bold text-gray-900 dark:text-white">{{ titulo }}</h2>
    <p class="text-sm text-gray-500 dark:text-gray-400">Esta tela chega no Lote {{ lote }}.</p>
    <a href="{% url 'dashboard' %}" class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-5 rounded-xl text-xs transition-all">Voltar ao Dashboard</a>
</div>
{% endblock %}
